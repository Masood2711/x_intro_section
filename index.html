<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Snap - Make Remote Work</title>

  <link rel="stylesheet" href="./style.css">

  <script src="./script.js" defer></script>
</head>

<body>

  <!-- Header -->
  <header class="header">

    <!-- Logo -->
    <a href="#" class="logo">
      <img
        src="./assets/images/logo.svg"
        alt="snap's logo"
      >
    </a>

    <!-- Mobile menu button -->
    <button class="open-menu" aria-label="Open menu">
      ☰
    </button>

    <!-- Navigation -->
    <nav class="nav">

      <!-- Close button for mobile -->
      <button class="close-menu" aria-label="Close menu">
        ✕
      </button>

      <ul class="nav-list">

        <!-- Features dropdown -->
        <li class="nav-link">

          <button class="dropdown-toggle">
            Features
          </button>

          <ul class="dropdown-list">

            <li class="dropdown-link">
              <a href="#" aria-label="todo-list">
                Todo List
              </a>
            </li>

            <li class="dropdown-link">
              <a href="#">
                Calendar
              </a>
            </li>

            <li class="dropdown-link">
              <a href="#">
                Reminders
              </a>
            </li>

            <li class="dropdown-link">
              <a href="#">
                Planning
              </a>
            </li>

          </ul>

        </li>

        <!-- Company dropdown -->
        <li class="nav-link">

          <button class="dropdown-toggle">
            Company
          </button>

          <ul class="dropdown-list">

            <li class="dropdown-link">
              <a href="#">History</a>
            </li>

            <li class="dropdown-link">
              <a href="#">Our Team</a>
            </li>

            <li class="dropdown-link">
              <a href="#">Blog</a>
            </li>

          </ul>

        </li>

        <!-- Other navigation links -->
        <li class="nav-link">
          <a href="#">Careers</a>
        </li>

        <li class="nav-link">
          <a href="#">About</a>
        </li>

      </ul>

      <!-- Login and Register buttons -->
      <div class="registration">

        <button type="button">Login</button>

        <button type="button">Register</button>

      </div>

    </nav>

    <!-- Mobile menu background -->
    <div class="overlay"></div>

  </header>

</body>

</html>
